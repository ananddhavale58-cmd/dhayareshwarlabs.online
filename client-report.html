<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Report Access | Dhayareshwar Labs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; background:#f4f6f8; margin:0; }
.box { max-width:420px; margin:80px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px #ccc; }
input, button { width:100%; padding:10px; margin-top:10px; }
button { background:#0a7cff; color:#fff; border:none; cursor:pointer; }
.report { display:none; margin-top:20px; }
iframe { width:100%; height:400px; border:1px solid #ccc; }
</style>
</head>

<body>
  <div id="navbar"></div>
  <script>
fetch('/navbar.html')
  .then(res => res.text())
  .then(data => {
    document.getElementById('navbar').innerHTML = data;

    // Now attach click
    document.getElementById("menuBtn").onclick = function() {
      var nav = document.getElementById("navLinks");
      nav.style.display = (nav.style.display === "block") ? "none" : "block";
    };
  });
</script>


<div class="box">
<h2>🔐 Client Report Login</h2>

<input type="password" id="pwd" placeholder="Enter Client Password">
<button onclick="check()">Login</button>

<div class="report" id="report">
<hr>

<h3>📄 AQI / OCEMS Report</h3>

<iframe src="AQI Display_Technical_Specification.pdf"></iframe>

<button onclick="window.print()">🖨️ Print</button>

<button onclick="share()">📲 WhatsApp Share</button>

<p id="gps">📍 Location: Fetching...</p>
</div>
</div>

<script>
function check(){
  const pass="client123";   // 🔐 change password here
  if(document.getElementById("pwd").value===pass){
    document.getElementById("report").style.display="block";
  } else {
    alert("Wrong Password");
  }
}

// GPS
navigator.geolocation.getCurrentPosition(p=>{
document.getElementById("gps").innerText=
"📍 Location: "+p.coords.latitude+", "+p.coords.longitude;
});

// WhatsApp
function share(){
let msg="Dhayareshwar Labs - Client AQI/OCEMS Report";
window.open("https://wa.me/?text="+encodeURIComponent(msg));
}
</script>

<div style="max-width:420px;margin:auto;background:white;padding:25px;border-radius:10px;box-shadow:0 0 10px #ccc;text-align:center;">

<h2>Report Verification</h2>

<input id="reportNo" placeholder="Enter Report Number"
style="width:80%;padding:10px;margin-top:10px;font-size:16px;">

<br>

<button onclick="verify()"
style="padding:10px 20px;margin-top:10px;background:#0a7cff;color:white;border:none;cursor:pointer;">
Verify
</button>

<div id="result" style="margin-top:20px;font-size:18px;"></div>

</div>


<script>

const sheetURL =
"https://docs.google.com/spreadsheets/d/1i3ejcBUBOqNgdylttEKebp9tcHDx4RXkXKbsbUEqkOY/gviz/tq?tqx=out:csv";

async function verify(){

let report =
document.getElementById("reportNo").value.trim().toUpperCase();

let res = await fetch(sheetURL);
let data = await res.text();

let rows = data.split("\n");

let found=null;

for(let i=1;i<rows.length;i++){

let cols=rows[i].split(",");

let rno=cols[0].replace(/"/g,"").trim().toUpperCase();

if(rno===report){

found=cols;
break;

}

}

if(found){

document.getElementById("result").innerHTML=

"✅ <b>Report Verified</b><br><br>"+
"Client Name: "+found[1]+"<br>"+
"Report Date: "+found[2]+"<br>"+
"Valid Till: "+found[3];

}

else{

document.getElementById("result").innerHTML="❌ Report Not Found";

}

}

</script>
</body>
  
</html>
